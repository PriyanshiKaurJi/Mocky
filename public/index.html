<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unofficial Mocky — Custom HTTP Response Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-600/30">M</div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Unofficial Mocky</h1>
          <p class="text-xs text-slate-400" id="hostDisplay"></p>
        </div>
      </div>
      <span class="text-xs px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        v3 API Active
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    <section class="lg:col-span-7">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <h2 class="text-base font-semibold mb-5">Design Your HTTP Mock Response</h2>

        <form id="mockForm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Status Code</label>
              <input type="number" id="status" value="200" min="100" max="599" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Content-Type</label>
              <select id="contentType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                <option value="application/json" selected>application/json</option>
                <option value="text/plain">text/plain</option>
                <option value="text/html">text/html</option>
                <option value="application/xml">application/xml</option>
                <option value="text/xml">text/xml</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Charset</label>
              <select id="charset" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                <option value="UTF-8" selected>UTF-8</option>
                <option value="ISO-8859-1">ISO-8859-1</option>
                <option value="UTF-16">UTF-16</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Mock Name / Label (Optional)</label>
              <input type="text" id="name" placeholder="Command: Pastebin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Expiration</label>
              <select id="expiration" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:border-indigo-500">
                <option value="never" selected>Never Expire</option>
                <option value="1year">1 Year</option>
                <option value="1month">1 Month</option>
                <option value="1week">1 Week</option>
                <option value="1day">1 Day</option>
              </select>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs text-slate-400">Custom HTTP Headers</label>
              <button type="button" id="addHeaderBtn" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">+ Add Header</button>
            </div>
            <div id="headersList" class="space-y-2"></div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs text-slate-400">HTTP Response Body</label>
              <button type="button" id="formatBtn" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Format JSON</button>
            </div>
            <textarea id="content" rows="9" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 font-mono text-xs text-slate-200 focus:outline-none focus:border-indigo-500">{
  "status": "success",
  "service": "unofficial-mocky",
  "author": "ItzPihu"
}</textarea>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition">
            Generate My HTTP Response
          </button>
        </form>
      </div>
    </section>

    <section class="lg:col-span-5 space-y-6">
      <div id="resultBox" class="bg-slate-900 border border-indigo-500/40 rounded-2xl p-6 shadow-xl hidden">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-3">Mock Created Successfully</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Mock Endpoint URL</label>
            <div class="flex gap-2">
              <input id="mockUrl" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-emerald-400" />
              <button id="copyUrlBtn" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium">Copy</button>
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Delete Secret Key</label>
            <div class="flex gap-2">
              <input id="mockSecret" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-amber-300" />
              <button id="copySecretBtn" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium">Copy</button>
            </div>
          </div>
          <div class="pt-2 flex gap-2">
            <a id="openUrlBtn" href="#" target="_blank" class="flex-1 py-2 px-3 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-medium text-center">
              Open Raw Endpoint
            </a>
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-semibold">Recent Mocks</h2>
          <button id="clearHistoryBtn" class="text-xs text-rose-400 hover:text-rose-300">Clear</button>
        </div>
        <div id="historyContainer" class="space-y-2.5 text-xs text-slate-400"></div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'unofficial_mocky_v3_items';
    document.getElementById('hostDisplay').textContent = window.location.origin;

    const headersList = document.getElementById('headersList');
    document.getElementById('addHeaderBtn').addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'flex gap-2 header-row';
      row.innerHTML = `
        <input type="text" placeholder="X-Header-Name" class="h-key w-5/12 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
        <input type="text" placeholder="Value" class="h-val w-6/12 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
        <button type="button" class="w-1/12 text-slate-400 hover:text-rose-400 font-bold">&times;</button>
      `;
      row.querySelector('button').addEventListener('click', () => row.remove());
      headersList.appendChild(row);
    });

    document.getElementById('formatBtn').addEventListener('click', () => {
      const el = document.getElementById('content');
      try {
        el.value = JSON.stringify(JSON.parse(el.value), null, 2);
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    });

    function loadHistory() {
      const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const container = document.getElementById('historyContainer');
      if (!items.length) {
        container.innerHTML = '<p class="text-slate-500">No mocks created from this browser yet.</p>';
        return;
      }
      container.innerHTML = '';
      items.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-2';
        div.innerHTML = `
          <a href="${item.url}" target="_blank" class="font-mono text-indigo-400 hover:underline truncate">${item.url}</a>
          <button class="text-slate-300 hover:text-white shrink-0">Copy</button>
        `;
        div.querySelector('button').addEventListener('click', () => navigator.clipboard.writeText(item.url));
        container.appendChild(div);
      });
    }

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      loadHistory();
    });

    document.getElementById('mockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Generating...';

      const headers = {};
      document.querySelectorAll('.header-row').forEach((r) => {
        const k = r.querySelector('.h-key').value.trim();
        const v = r.querySelector('.h-val').value.trim();
        if (k && v) headers[k] = v;
      });

      const payload = {
        status: Number(document.getElementById('status').value),
        content_type: document.getElementById('contentType').value,
        charset: document.getElementById('charset').value,
        name: document.getElementById('name').value.trim() || null,
        expiration: document.getElementById('expiration').value,
        headers,
        content: document.getElementById('content').value
      };

      try {
        const res = await fetch('/api/mock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to create mock');

        const finalUrl = `${window.location.origin}/v3/${data.id}`;
        document.getElementById('mockUrl').value = finalUrl;
        document.getElementById('mockSecret').value = data.secret || '';
        document.getElementById('openUrlBtn').href = finalUrl;
        document.getElementById('resultBox').classList.remove('hidden');

        const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        history.unshift({ id: data.id, url: finalUrl, secret: data.secret });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 20)));
        loadHistory();
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate My HTTP Response';
      }
    });

    document.getElementById('copyUrlBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('mockUrl').value);
    });
    document.getElementById('copySecretBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('mockSecret').value);
    });

    loadHistory();
  </script>
</body>
</html>
