<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Unofficial Mocky — HTTP Response Studio</title>
<link rel="icon" type="image/jpeg" href="https://i.postimg.cc/MpS04bjb/c6df274a42cb9a60d5e8c3e17c393092.jpg">
<meta property="og:image" content="https://i.postimg.cc/MpS04bjb/c6df274a42cb9a60d5e8c3e17c393092.jpg">
<meta property="og:title" content="Unofficial Mocky Studio">
<meta property="og:description" content="Generate custom HTTP responses and mock endpoints instantly.">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
--bg-base: #070913;
--panel-bg: rgba(18, 22, 38, 0.65);
--panel-border: rgba(255, 255, 255, 0.12);
--panel-border-hover: rgba(255, 255, 255, 0.22);
--input-bg: rgba(10, 13, 24, 0.7);
--accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #3b82f6 100%);
}
* {
-webkit-tap-highlight-color: transparent;
box-sizing: border-box;
}
body {
background-color: var(--bg-base);
color: #f1f5f9;
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
overflow-x: hidden;
min-height: 100vh;
}
.ambient-bg {
position: fixed;
inset: 0;
z-index: -1;
overflow: hidden;
background: radial-gradient(circle at 50% 0%, #151a36 0%, #070913 100%);
}
.glow-blob {
position: absolute;
border-radius: 50%;
filter: blur(85px);
opacity: 0.5;
animation: drift 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
will-change: transform;
}
.blob-1 { width: 450px; height: 450px; background: #4f46e5; top: -10%; left: -5%; }
.blob-2 { width: 400px; height: 400px; background: #db2777; bottom: -10%; right: -5%; animation-delay: -7s; }
@keyframes drift {
0% { transform: translate3d(0, 0, 0) scale(1); }
100% { transform: translate3d(40px, -40px, 0) scale(1.1); }
}
.glass-panel {
background: var(--panel-bg);
backdrop-filter: blur(24px) saturate(180%);
-webkit-backdrop-filter: blur(24px) saturate(180%);
border: 1px solid var(--panel-border);
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
border-radius: 20px;
transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.glass-panel:hover {
border-color: var(--panel-border-hover);
}
.custom-input {
background: var(--input-bg);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 12px;
color: #f8fafc;
transition: all 0.2s ease;
}
.custom-input:focus {
outline: none;
border-color: #818cf8;
box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
background: rgba(10, 13, 24, 0.9);
}
.gradient-btn {
background: var(--accent-grad);
background-size: 200% 200%;
border: 1px solid rgba(255, 255, 255, 0.25);
box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
border-radius: 14px;
transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.gradient-btn:hover {
transform: translateY(-1px);
box-shadow: 0 14px 30px -5px rgba(129, 140, 248, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
.gradient-btn:active {
transform: translateY(1px);
}
.utility-btn {
background: rgba(255, 255, 255, 0.06);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 10px;
transition: all 0.2s ease;
}
.utility-btn:hover {
background: rgba(255, 255, 255, 0.12);
}
.animate-pop {
animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes popIn {
0% { opacity: 0; transform: scale(0.96) translateY(10px); }
100% { opacity: 1; transform: scale(1) translateY(0); }
}
</style>
</head>
<body class="pb-12">
<div class="ambient-bg">
<div class="glow-blob blob-1"></div>
<div class="glow-blob blob-2"></div>
</div>

<header class="sticky top-3 z-30 mx-auto max-w-5xl px-4">
<div class="glass-panel px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<img src="https://i.postimg.cc/MpS04bjb/c6df274a42cb9a60d5e8c3e17c393092.jpg" alt="Logo" class="h-10 w-10 rounded-xl object-cover border border-white/20 shadow-md" />
<div>
<h1 class="text-sm sm:text-base font-bold text-white tracking-tight">Unofficial Mocky</h1>
<p class="text-[11px] text-slate-400 font-mono truncate max-w-[200px] sm:max-w-xs" id="hostDisplay"></p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 font-medium">
<span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
Online
</span>
</div>
</div>
</header>

<main class="max-w-5xl mx-auto px-4 pt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
<section class="lg:col-span-7">
<div class="glass-panel p-5 sm:p-6">
<div class="flex items-center justify-between mb-5">
<h2 class="text-sm font-semibold text-slate-200">Create HTTP Response</h2>
<button type="button" id="sampleBtn" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Load Template</button>
</div>

<form id="mockForm" class="space-y-4">
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
<div>
<label class="block text-[11px] font-medium text-slate-400 mb-1">Status Code</label>
<input type="number" id="status" value="200" min="100" max="599" required class="custom-input w-full px-3 py-2 text-xs font-mono" />
</div>
<div>
<label class="block text-[11px] font-medium text-slate-400 mb-1">Content-Type</label>
<select id="contentType" class="custom-input w-full px-3 py-2 text-xs">
<option value="application/json" selected>application/json</option>
<option value="text/plain">text/plain</option>
<option value="text/html">text/html</option>
<option value="application/javascript">application/javascript</option>
<option value="application/xml">application/xml</option>
</select>
</div>
<div>
<label class="block text-[11px] font-medium text-slate-400 mb-1">Charset</label>
<select id="charset" class="custom-input w-full px-3 py-2 text-xs">
<option value="UTF-8" selected>UTF-8</option>
<option value="ISO-8859-1">ISO-8859-1</option>
</select>
</div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<div>
<label class="block text-[11px] font-medium text-slate-400 mb-1">Expiration</label>
<select id="expiration" class="custom-input w-full px-3 py-2 text-xs">
<option value="1month" selected>1 Month</option>
<option value="1year">1 Year</option>
<option value="1week">1 Week</option>
<option value="1day">1 Day</option>
<option value="1hour">1 Hour</option>
<option value="10min">10 Minutes</option>
</select>
</div>
<div>
<label class="block text-[11px] font-medium text-slate-400 mb-1">Secret Key</label>
<input type="text" id="secret" placeholder="Auto-generated if empty" class="custom-input w-full px-3 py-2 text-xs font-mono" />
</div>
</div>

<div>
<div class="flex items-center justify-between mb-1">
<label class="text-[11px] font-medium text-slate-400">Custom Headers</label>
<button type="button" id="addHeaderBtn" class="utility-btn px-2 py-0.5 text-[11px] text-indigo-300 font-medium">+ Add Header</button>
</div>
<div id="headersList" class="space-y-2"></div>
</div>

<div>
<div class="flex items-center justify-between mb-1">
<label class="text-[11px] font-medium text-slate-400">Response Body</label>
<button type="button" id="formatBtn" class="utility-btn px-2 py-0.5 text-[11px] text-indigo-300 font-medium">Format JSON</button>
</div>
<textarea id="content" rows="8" class="custom-input w-full p-3 font-mono text-xs leading-relaxed" placeholder="Enter JSON, text, or HTML response...">{
  "status": "success",
  "message": "Endpoint configured successfully!"
}</textarea>
</div>

<div id="errorBanner" class="hidden p-3 rounded-xl bg-rose-500/20 border border-rose-500/30 text-xs text-rose-200 animate-pop"></div>

<button type="submit" id="submitBtn" class="gradient-btn w-full py-3 px-4 text-white font-semibold text-xs tracking-wide">
Generate Endpoint
</button>
</form>
</div>
</section>

<section class="lg:col-span-5 space-y-5">
<div id="resultBox" class="glass-panel p-5 hidden animate-pop">
<div class="flex items-center justify-between mb-3">
<span class="text-[11px] font-semibold uppercase tracking-wider text-emerald-400">Ready</span>
<span id="statusBadge" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-white/10 text-white"></span>
</div>

<div class="space-y-3">
<div>
<label class="block text-[11px] text-slate-400 mb-1">View Page URL (UI)</label>
<div class="flex gap-2">
<input id="viewUrl" readonly class="custom-input w-full px-3 py-2 text-xs font-mono text-indigo-300 truncate" />
<button type="button" id="copyViewBtn" class="utility-btn px-3 py-2 text-xs font-medium text-white shrink-0">Copy</button>
</div>
</div>

<div>
<label class="block text-[11px] text-slate-400 mb-1">Raw Endpoint URL (API)</label>
<div class="flex gap-2">
<input id="rawUrl" readonly class="custom-input w-full px-3 py-2 text-xs font-mono text-emerald-300 truncate" />
<button type="button" id="copyRawBtn" class="utility-btn px-3 py-2 text-xs font-medium text-white shrink-0">Copy</button>
</div>
</div>

<div>
<label class="block text-[11px] text-slate-400 mb-1">Secret Key</label>
<div class="flex gap-2">
<input id="mockSecret" readonly class="custom-input w-full px-3 py-2 text-xs font-mono text-amber-300 truncate" />
<button type="button" id="copySecretBtn" class="utility-btn px-3 py-2 text-xs font-medium text-white shrink-0">Copy</button>
</div>
</div>

<div class="pt-1 flex gap-2">
<a id="openViewBtn" href="#" target="_blank" class="gradient-btn flex-1 py-2 px-3 text-xs font-semibold text-white text-center">Open View</a>
<a id="openRawBtn" href="#" target="_blank" class="utility-btn flex-1 py-2 px-3 text-xs font-semibold text-slate-200 text-center">Open Raw</a>
</div>
</div>
</div>

<div class="glass-panel overflow-hidden">
<div class="px-5 py-3 border-b border-white/10 flex items-center justify-between bg-white/[0.02]">
<h2 class="text-xs font-semibold text-slate-300">Recent History</h2>
<button id="clearHistoryBtn" class="text-[11px] text-rose-400 hover:text-rose-300 transition">Clear</button>
</div>
<div id="historyContainer" class="p-4 space-y-2 text-xs text-slate-300 max-h-72 overflow-y-auto"></div>
</div>
</section>
</main>

<script>
const STORAGE_KEY = 'unofficial_mocky_history_v3';
const DEFAULT_SECRET = 'uY8qN3mXv5B9zW4kP7rT2jE1sQ6cK9hA4fD8gV2bN7mX3pL1zW5kQ8rT0jE2sC9h';
document.getElementById('hostDisplay').textContent = window.location.origin;
const headersList = document.getElementById('headersList');
const errorBanner = document.getElementById('errorBanner');
const contentEl = document.getElementById('content');
const contentTypeEl = document.getElementById('contentType');
function showError(msg) {
errorBanner.textContent = msg;
errorBanner.classList.remove('hidden');
}
function hideError() {
errorBanner.classList.add('hidden');
}
document.getElementById('addHeaderBtn').addEventListener('click', () => {
const row = document.createElement('div');
row.className = 'flex gap-2 header-row animate-pop';
row.innerHTML = `
<input type="text" placeholder="Header Name" class="h-key custom-input w-5/12 px-2.5 py-1.5 text-xs font-mono" />
<input type="text" placeholder="Value" class="h-val custom-input w-6/12 px-2.5 py-1.5 text-xs font-mono" />
<button type="button" class="utility-btn w-1/12 text-rose-400 font-bold">&times;</button>
`;
row.querySelector('button').addEventListener('click', () => row.remove());
headersList.appendChild(row);
});
document.getElementById('formatBtn').addEventListener('click', () => {
hideError();
try {
contentEl.value = JSON.stringify(JSON.parse(contentEl.value), null, 2);
contentTypeEl.value = 'application/json';
} catch (e) {
showError('Invalid JSON format: ' + e.message);
}
});
document.getElementById('sampleBtn').addEventListener('click', () => {
contentTypeEl.value = 'application/json';
contentEl.value = JSON.stringify({
status: 200,
service: 'unofficial-mocky',
timestamp: new Date().toISOString()
}, null, 2);
hideError();
});
function loadHistory() {
const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
const container = document.getElementById('historyContainer');
if (!items.length) {
container.innerHTML = '<p class="text-slate-500 text-center py-3">No recent endpoints generated.</p>';
return;
}
container.innerHTML = '';
items.forEach((item) => {
const div = document.createElement('div');
div.className = 'custom-input p-2.5 flex items-center justify-between gap-2';
div.innerHTML = `
<div class="truncate">
<a href="${item.viewUrl}" target="_blank" class="font-mono text-indigo-400 hover:text-white transition truncate block text-[11px]">${item.viewUrl}</a>
<span class="text-[10px] text-slate-500">HTTP ${item.status}</span>
</div>
<button type="button" class="utility-btn px-2 py-1 text-[10px] text-white shrink-0">Copy</button>
`;
const btn = div.querySelector('button');
btn.addEventListener('click', () => {
navigator.clipboard.writeText(item.viewUrl);
btn.textContent = 'Done';
setTimeout(() => (btn.textContent = 'Copy'), 1000);
});
container.appendChild(div);
});
}
document.getElementById('clearHistoryBtn').addEventListener('click', () => {
localStorage.removeItem(STORAGE_KEY);
loadHistory();
});
document.getElementById('mockForm').addEventListener('submit', async (e) => {
e.preventDefault();
hideError();
const submitBtn = document.getElementById('submitBtn');
submitBtn.disabled = true;
submitBtn.textContent = 'Generating...';
const headers = {};
document.querySelectorAll('.header-row').forEach((r) => {
const k = r.querySelector('.h-key').value.trim();
const v = r.querySelector('.h-val').value.trim();
if (k && v) headers[k] = v;
});
const userSecret = document.getElementById('secret').value.trim() || DEFAULT_SECRET;
const statusVal = Number(document.getElementById('status').value) || 200;
const payload = {
status: statusVal,
content: contentEl.value,
content_type: contentTypeEl.value,
charset: document.getElementById('charset').value,
secret: userSecret,
expiration: document.getElementById('expiration').value
};
if (Object.keys(headers).length > 0) payload.headers = headers;
try {
const res = await fetch('/api/mock', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
const rawText = await res.text();
let data = {};
try { data = JSON.parse(rawText); } catch (_) {}
if (!res.ok) throw new Error(data.message || data.error || rawText || `HTTP ${res.status}`);
const rawLink = data.link ? data.link.replace(/^http:\/\//i, window.location.protocol + '//') : `${window.location.origin}/v3/${data.id}`;
const mockId = data.id || rawLink.split('/v3/')[1];
const viewLink = `${window.location.origin}/view/${mockId}`;
document.getElementById('viewUrl').value = viewLink;
document.getElementById('rawUrl').value = rawLink;
document.getElementById('mockSecret').value = userSecret;
document.getElementById('openViewBtn').href = viewLink;
document.getElementById('openRawBtn').href = rawLink;
document.getElementById('statusBadge').textContent = `${statusVal} OK`;
document.getElementById('resultBox').classList.remove('hidden');
const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
history.unshift({ viewUrl: viewLink, rawUrl: rawLink, status: statusVal });
localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 20)));
loadHistory();
} catch (err) {
showError('Error: ' + err.message);
} finally {
submitBtn.disabled = false;
submitBtn.textContent = 'Generate Endpoint';
}
});
function setupCopy(btnId, inputId) {
const btn = document.getElementById(btnId);
btn.addEventListener('click', () => {
navigator.clipboard.writeText(document.getElementById(inputId).value);
const orig = btn.textContent;
btn.textContent = 'Copied!';
setTimeout(() => (btn.textContent = orig), 1000);
});
}
setupCopy('copyViewBtn', 'viewUrl');
setupCopy('copyRawBtn', 'rawUrl');
setupCopy('copySecretBtn', 'mockSecret');
loadHistory();
</script>
</body>
</html>
